name: CICD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Syntax-check backend source
        run: find backend/src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Syntax-check frontend source
        run: for f in site/*.js; do node --check "$f"; done

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bridgecart:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bridgecart:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
