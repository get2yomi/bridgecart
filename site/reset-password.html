<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Choose a new password for your NaijaBridge account." />
  <title>Reset password — NaijaBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./index.html" aria-label="NaijaBridge home">
      <span class="brand-mark" aria-hidden="true">NB</span>
      <span>NaijaBridge</span>
    </a>
    <nav aria-label="Main navigation">
      <a href="./index.html">Home</a>
    </nav>
  </header>

  <main class="standalone-main">
    <a class="standalone-footer-link" href="./index.html">&larr; Back to NaijaBridge</a>
    <section class="standalone-card">
      <span class="eyebrow">RESET PASSWORD</span>
      <h1>Choose a new password</h1>
      <p class="lead" id="reset-lead">Enter a new password for your account below.</p>

      <form id="reset-form">
        <label class="field full-width"><span>New password <small>(min. 8 characters)</small></span><input id="reset-password" type="password" autocomplete="new-password" minlength="8" required /></label>
        <p id="reset-error" class="form-error" hidden></p>
        <button class="primary-button" type="submit" style="margin-top:14px;">Reset password <span aria-hidden="true">→</span></button>
      </form>

      <div id="reset-success" class="form-success" hidden style="margin-top:16px;">
        Your password has been reset. <a href="./index.html">Return to NaijaBridge to log in</a>.
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const form = document.getElementById("reset-form");
    const errorBox = document.getElementById("reset-error");
    const successBox = document.getElementById("reset-success");

    if (!token) {
      document.getElementById("reset-lead").textContent = "This link is missing a reset token. Please request a new password reset from the log in screen.";
      form.hidden = true;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.hidden = true;
      const button = form.querySelector("button[type='submit']");
      button.disabled = true;
      button.textContent = "Resetting…";
      try {
        const response = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, newPassword: document.getElementById("reset-password").value })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Unable to reset your password.");
        form.hidden = true;
        successBox.hidden = false;
      } catch (error) {
        errorBox.textContent = error.message;
        errorBox.hidden = false;
      } finally {
        button.disabled = false;
        button.textContent = "Reset password";
      }
    });
  </script>
</body>
</html>
